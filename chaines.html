<title>APK Centre — Liste des chaînes</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f3f6;color:#111}
header{background:#fff;padding:18px 20px;position:sticky;top:0;z-index:2;box-shadow:0 2px 10px #0001}
h1{margin:0 0 12px;font-size:30px}.tabs{display:flex;gap:10px;flex-wrap:wrap}.tabs button{border:0;padding:10px 18px;border-radius:10px;background:#eee;font-weight:700;cursor:pointer}.tabs button.active{background:#ff7900;color:#fff}
.controls{max-width:1200px;margin:18px auto 0;padding:0 16px;display:flex;gap:10px}.controls input{flex:1;padding:13px;border:1px solid #ccd1d7;border-radius:10px;font-size:16px}.count{padding:13px 0;color:#555}
.grid{max-width:1200px;margin:18px auto;padding:0 16px 90px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:#fff;border:1px solid #ddd;border-radius:8px;display:grid;grid-template-columns:58px 1fr;min-height:46px;overflow:hidden}.num{background:#fafafa;border-right:1px solid #ddd;display:flex;align-items:center;justify-content:center;font-weight:700;color:#555}.name{display:flex;align-items:center;padding:9px 10px;font-weight:600}.empty{grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:12px}
footer{position:fixed;bottom:0;left:0;right:0;background:#222;color:#fff;text-align:center;padding:11px;font-size:13px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){h1{font-size:24px}.grid{grid-template-columns:1fr}.controls{flex-direction:column}.count{padding:0}}
</style></head>
